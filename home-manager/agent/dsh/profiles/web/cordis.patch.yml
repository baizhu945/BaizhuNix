# 由 home-manager 管理(agent/dsh/dsh.nix;皮肤 insert 由 skin.nix 部署包体)。
# 追加自定义 patch 行请编辑 dsh.nix。
- insert:
    - id: confirm-writes
      name: './plugins/confirm-writes.mjs'
      config:
        # 仅在此预设(第四模式)下拦截写/执行
        preset: confirm
        askTools:
          - write
          - edit
          - str_replace_editor
          - bash
          - pwsh
          - terminal_send

    # 审批面板插件(approval-always-allow + approval-keyboard 两个源码补丁
    # 的插件迁移):内置面板仍可工作,本插件以 composer chain 更高优先级
    # 接管审批 UI,提供「总是允许」第三按钮与 Esc/Ctrl+Enter 快捷键。
    # 双半包:host 半体为空,client 半体经 package.json 的 dsh.client 声明加载
    # (包本体由 home-manager 安装到本 profile 的 node_modules)。
    - id: approval-tweaks
      name: 'dsh-baizhu-approval'

    # ── maid-atelier 皮肤(dsh-deep-whale)──────────────────────────────
    # https://github.com/Small-tailqwq/dsh-deep-whale
    # 官方装法 `dsh plugin --profile web add ../dsh-deep-whale/maid-atelier`
    # 经 pnpm 把皮肤包装进本 profile 的 node_modules 并追加到 package.json
    # 的 dsh.profile.bundles;启动时该 bundle 的 cordis.patch.yml 恰好就是
    # 下面这行 insert。这里由 home-manager 声明式等效:包体真实文件部署见
    # skin.nix 的 home.activation.dshSkinMaidAtelier,insert 行直接并入本
    # patch 层,与 dsh-baizhu-approval(包名从 node_modules 解析)同一机制。
    # 与皮肤中心/dsh-skin 的互斥切换兼容(wiring.id = ui-skin-maid-atelier)。
    - id: ui-skin-maid-atelier
      name: '@dsh-external/dsh-client-ui-skin-maid-atelier'

# ── 权限预设表 ──────────────────────────────────────────────────────────
# dsh 三个内置模式保持原样(Read Only / Workspace Write / Full Access);
# 新增第四模式 confirm = 无沙箱边界 + 每次写/执行询问(配合 confirm-writes 插件)。
# defaultPreset: confirm → 新会话默认启用询问模式。
- id: permission
  config:
    defaultPreset: confirm
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
      confirm:
        sandbox: danger-full-access
        approval: ask
        name: Confirm (ask)
        description: Full access, but every write and command asks for your approval

# approval 服务默认策略固定为 ask,保证新会话/回退场景下写/执行始终可询问
- id: approval
  config:
    policy: ask
