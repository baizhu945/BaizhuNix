id = "baizhu/supergfxctl"
name = "SuperGFX Control"
version = "1.0.0"
plugin_api = 24
author = "<yourusername>"
license = "MIT"
dependencies = []
tags = ["control-center", "gpu", "asus"]
icon = "device-desktop"
description = "GPU mode control through supergfxctl, including V4 pending-action hints."

[[setting]]
key = "debug"
type = "bool"
label_key = "settings.debug.label"
default = true
advanced = true

[[setting]]
key = "patch_pending"
type = "bool"
label_key = "settings.patch_pending.label"
default = true

[[setting]]
key = "polling"
type = "bool"
label_key = "settings.polling.label"
default = false

[[setting]]
key = "polling_interval"
type = "int"
label_key = "settings.polling_interval.label"
default = 3000
min = 1000
max = 60000
advanced = true

[[shortcut]]
id = "shortcut"
entry = "shortcut.luau"

[[panel]]
id = "panel"
entry = "panel.luau"
width = 420
height = 170
placement = "attached"
position = "top_right"
