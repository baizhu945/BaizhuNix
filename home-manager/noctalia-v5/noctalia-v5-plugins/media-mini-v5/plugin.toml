id = "baizhu/media_mini"
name = "Media Mini (V4)"
version = "1.0.0"
plugin_api = 30
author = "<yourusername>"
license = "MIT"
dependencies = []
tags = ["bar", "media", "visualizer"]
icon = "music"
description = "A V5 port of Noctalia V4 MediaMini with a background visualizer and album-art progress ring."

[[widget]]
id = "bar"
entry = "bar.luau"

  [widget.actions]
  left = "panel-toggle control-center media"
  right = "panel-toggle baizhu/media_mini:menu"
  middle = "media toggle"
  back = "media previous"
  forward = "media next"
  scroll_up = "none"
  scroll_down = "none"

  [[widget.setting]]
  key = "audio_spectrum"
  type = "bool"
  label_key = "settings.audio_spectrum.label"
  default = true

  [[widget.setting]]
  key = "audio_spectrum_bands"
  type = "int"
  label_key = "settings.audio_spectrum_bands.label"
  default = 64
  min = 8
  max = 64
  step = 4

  [[widget.setting]]
  key = "content_width"
  type = "int"
  label_key = "settings.content_width.label"
  default = 135
  min = 80
  max = 220
  step = 1

[[panel]]
id = "menu"
entry = "menu.luau"
width = 280
height = 230
placement = "attached"
position = "top_left"
dismiss_on_outside_click = true
