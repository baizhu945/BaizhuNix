id = "baizhu/todo"
name = "Todo List"
version = "1.0.0"
plugin_api = 22
author = "<yourusername>"
license = "MIT"
dependencies = []
tags = ["bar", "panel", "productivity"]
icon = "clipboard-check"
description = "A small todo list panel compatible with the v4 workflow."

[[setting]]
key = "show_completed"
type = "bool"
label_key = "settings.show_completed.label"
default = true

[[setting]]
key = "export_path"
type = "folder"
label_key = "settings.export_path.label"
default = "/home/<yourusername>/Documents"

[[setting]]
key = "export_format"
type = "select"
label_key = "settings.export_format.label"
default = "markdown"
options = [
  { value = "markdown", label_key = "settings.export_format.markdown" },
  { value = "json", label_key = "settings.export_format.json" },
]

[[setting]]
key = "export_empty_sections"
type = "bool"
label_key = "settings.export_empty_sections.label"
default = false

[[setting]]
key = "use_custom_colors"
type = "bool"
label_key = "settings.use_custom_colors.label"
default = false

[[setting]]
key = "priority_low_color"
type = "color"
label_key = "settings.priority_low_color.label"
default = "#9E9E9E"
visible_when = { key = "use_custom_colors", values = ["true"] }

[[setting]]
key = "priority_medium_color"
type = "color"
label_key = "settings.priority_medium_color.label"
default = "#2196F3"
visible_when = { key = "use_custom_colors", values = ["true"] }

[[setting]]
key = "priority_high_color"
type = "color"
label_key = "settings.priority_high_color.label"
default = "#F44336"
visible_when = { key = "use_custom_colors", values = ["true"] }

[[service]]
id = "service"
entry = "service.luau"

[[widget]]
id = "bar"
entry = "bar.luau"

  [widget.actions]
  left = "panel-toggle baizhu/todo:panel"
  right = "settings-open-plugin baizhu/todo"

[[panel]]
id = "panel"
entry = "panel.luau"
width = 700
height = 500
placement = "attached"
position = "top_left"
