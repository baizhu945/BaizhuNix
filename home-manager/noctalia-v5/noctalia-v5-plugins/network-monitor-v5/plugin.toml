id = "baizhu/network_monitor"
name = "Network Monitor"
version = "1.0.0"
plugin_api = 24
author = "<yourusername>"
license = "MIT"
dependencies = []
tags = ["bar", "network", "system"]
icon = "network"
description = "Combined download/upload monitor matching the V4 SystemMonitor layout."

[[setting]]
key = "external_monitor"
type = "string"
label_key = "settings.external_monitor.label"
default = "resources || missioncenter || jdsystemmonitor || corestats || system-monitoring-center || gnome-system-monitor || plasma-systemmonitor || mate-system-monitor || ukui-system-monitor || deepin-system-monitor || pantheon-system-monitor"
advanced = true

[[widget]]
id = "bar"
entry = "bar.luau"

  [widget.actions]
  left = "panel-toggle control-center system"
  right = "settings-open-plugin baizhu/network_monitor"
  middle = "none"

