id = "baizhu/screen_toolkit"
name = "Screen Toolkit"
version = "1.0.0"
plugin_api = 24
author = "<yourusername>"
license = "MIT"
dependencies = ["grim", "slurp", "satty", "hyprpicker", "zbarimg", "tesseract", "mpv", "wl-copy", "magick", "curl", "jq", "xdg-open", "wl-screenrec", "wf-recorder", "chameleos", "chamel"]
tags = ["screen", "annotation", "utility"]
icon = "screenshot"
description = "V4-compatible screen capture, annotation, OCR, color and media tools for Noctalia v5."

[[service]]
id = "service"
entry = "service.luau"

[[panel]]
id = "panel"
entry = "panel.luau"
width = 340
height = 640
placement = "attached"
position = "top_left"
