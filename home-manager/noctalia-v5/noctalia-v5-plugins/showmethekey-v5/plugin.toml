id = "baizhu/showmethekey"
name = "Show Me The Key"
version = "1.0.0"
plugin_api = 14
author = "<yourusername>"
license = "MIT"
dependencies = ["showmethekey-cli", "python3"]
tags = ["bar", "keyboard"]
icon = "keyboard"
description = "Shows the latest keyboard or mouse key combination in the Noctalia bar."

[[widget]]
id = "bar"
entry = "bar.luau"

  # V4's empty CustomButton commands open widget settings on all buttons.
  [widget.actions]
  left = "settings-open-widget"
  right = "settings-open-widget"
  middle = "settings-open-widget"
