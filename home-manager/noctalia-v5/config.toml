# Noctalia v5 配置
# 基于 v4 配置迁移，保留原使用习惯和视觉风格
# v5 是破坏性更新，配置格式已从 JSON 改为 TOML

# ── Shell ─────────────────────────────────────────────────────────────────────

[accessibility]
ui_scale              = 1.0

[shell]
corner_radius_scale   = 1.0
font_family           = "Noto Sans CJK HK"
time_format           = "{:%H:%M}"
date_format           = "周%a, %b %d"
lang                  = "zh-CN"
# V4's configured ~/.face is absent and falls back to AccountsService.
# Point V5 at that same resolved avatar directly to avoid a decode warning.
avatar_path           = "/var/lib/AccountsService/icons/<yourusername>"
clipboard_enabled     = true
clipboard_auto_paste  = "auto"
clipboard_history_max_entries = 100
telemetry_enabled     = true
polkit_agent          = false
password_style        = "default"
show_location         = true
launch_apps_custom_command = "app2unit $CMD"

[shell.animation]
enabled = true
speed   = 1.0

[shell.shadow]
direction = "down_right"
alpha     = 0.55

[shell.panel]
# V4 panelsAttachedToBar=true；V5 使用 attached 保持面板贴合顶栏。
# soft 提供 V4 panelBackgroundOpacity=0.8；显式关闭 compositor blur，并阻止
# 透明 bar 的 0 opacity 传给 panel，得到 V4 的白色半透明表面。
transparency_mode            = "soft"
compositor_blur_enabled      = false
borders                      = true
shadow                       = true
launcher_placement           = "attached"
clipboard_placement          = "attached"
control_center_placement     = "attached"
wallpaper_placement          = "attached"
# V4 sessionMenu.position=center 是独立的居中对话框。
session_placement            = "floating"
launcher_position            = "top_left"
# V4 剪贴板属于左上角 App Launcher，而不是居中窗口。
clipboard_position           = "top_left"
control_center_position      = "top_right"
session_position             = "center"

[shell.launcher]
categories              = true
show_icons              = true
show_app_origin_indicator = false
sort_by_usage           = true
app_grid                = false
compact                 = false
auto_paste              = "off"

# V4 enableSessionSearch/enableWindowsSearch
[shell.launcher.providers.session]
prefix = "session"
global = true

[shell.launcher.providers.windows]
prefix = "win"
global = true

[shell.screenshot]
save_to_file      = true
directory         = "/home/<yourusername>/Pictures/Screenshots"
filename_pattern  = "screenshot_%Y%m%d_%H%M%S"
copy_to_clipboard = true

[shell.mpris]
blacklist = []

# V5 插件必须使用 plugin.toml + Luau；legacy-v4 的 plugins.json 仅供 V4 使用。
# 本地移植插件由 Home Manager 放入 ~/.config/noctalia/v5-plugins/。
[plugins]
enabled = [
  "baizhu/catwalk",
  "baizhu/media_mini",
  "baizhu/network_monitor",
  "baizhu/showmethekey",
  "baizhu/todo",
  "baizhu/keybind_cheatsheet",
  "baizhu/screen_toolkit",
  "baizhu/supergfxctl",
  "baizhu/v4_extras",
  "baizhu/bottom_bar",
  "noctalia/screen_recorder",
]
auto_update = "none"

[[plugins.source]]
name = "v5-local"
kind = "path"
location = "~/.config/noctalia/v5-plugins"
enabled = true

# The persisted V4 recorder settings are intentionally carried over exactly:
# full-screen capture, HEVC/AAC, ultra quality, full color range, and the
# dedicated ScreenRecords directory. The local V5 fork adds `screen` as the
# equivalent full-screen source (the upstream plugin only exposes portal and
# focused-monitor capture).
[plugin_settings."noctalia/screen_recorder"]
# video_source is intentionally omitted: the local manifest defaults it to
# `screen`, while omitting it keeps `noctalia config validate` independent of
# the plugin source path (the upstream manifest only knows portal/focused).
directory             = "/home/<yourusername>/Videos/ScreenRecords"
filename_pattern      = "recording_%Y%m%d_%H%M%S"
frame_rate            = 60
frame_rate_mode       = "vfr"
video_codec           = "hevc"
video_encoder         = "gpu"
video_bitrate_mode    = "vbr"
video_quality         = "ultra"
video_qp              = 25
video_bitrate         = "20000"
resolution            = "original"
audio_source          = "default_output"
custom_audio_sources  = ""
audio_codec           = "aac"
audio_bitrate         = 0
show_cursor           = true
color_range           = "full"
copy_to_clipboard     = false
post_save_script      = ""
hide_inactive         = false
glyph_unavailable     = "video-off"
glyph_idle            = "video"
glyph_pending         = "video"
glyph_recording       = "video"
glyph_replaying       = "repeat"
replay_enabled        = false
replay_duration       = 30
replay_filename_pattern = "replay_%Y%m%d_%H%M%S"
replay_storage        = "ram"
restore_portal        = false

# Catwalk and SuperGFX plugin defaults are set in their local manifests so
# the core validator remains independent of the path-source plugin tree.
# ── Theme ─────────────────────────────────────────────────────────────────────
# v4: light mode, 使用壁纸颜色 (tonal-spot)

[theme]
mode   = "light"
source = "wallpaper"
builtin = "Noctalia"
wallpaper_scheme = "m3-tonal-spot"
# V4/Quickshell 使用现有 QS_ICON_THEME=Fluent；原生 V5 默认仍是 system。
icon_theme_source = "qs_environment"

# Keep the established wallpaper-palette integration alive while the v4 shell
# remains the default. The Home Manager module installs the input template;
# the existing wallpaper-theme-sync user service consumes this output and
# updates DankMaterialShell, Waybar lyrics, and mouse-trail.
[theme.templates.user.v4_compat_colors]
input_path  = "$XDG_CONFIG_HOME/noctalia/templates/noctalia-colors.json"
output_path = "$XDG_CONFIG_HOME/noctalia/colors.json"

# ── Wallpaper ─────────────────────────────────────────────────────────────────
# v4: /home/<yourusername>/Downloads/Wallpaper/Static, random 600s, crop, disc transition

[wallpaper]
enabled             = true
fill_mode           = "crop"
fill_color          = "#000000"
directory           = "/home/<yourusername>/Downloads/Wallpaper/Static"
transition          = ["disc"]
transition_duration = 3000
edge_smoothness     = 0.05
transition_on_startup = true

[wallpaper.default]
path = ""

[wallpaper.automation]
enabled          = true
interval_seconds = 600
order            = "random"
recursive        = true

# ── Location & Weather ────────────────────────────────────────────────────────
# v4: Guangzhou, 天气开启

[location]
address     = "Guangzhou"
auto_locate = false

[weather]
enabled         = true
refresh_minutes = 30
unit            = "celsius"
effects         = true

# ── Notifications ─────────────────────────────────────────────────────────────
# v4: top_right, 背景不透明, 3s 常规, 2s 低优, 5s 紧急

[notification]
enable_daemon      = true
show_app_name      = true
show_actions       = true
position           = "top_right"
background_opacity = 1.0
offset_x           = 20
offset_y           = 8
layer              = "overlay"

[notification.timeout]
# V4 ignores sender expire_timeout and chooses a duration by urgency.
mode        = "urgency"
low_ms      = 2000
normal_ms   = 3000
critical_ms = 5000

# ── OSD ───────────────────────────────────────────────────────────────────────
# v4: top_right, 启用, 2s 自动隐藏

[osd]
enabled            = true
position           = "top_right"
orientation        = "horizontal"
background_opacity = 1.0
hide_delay_ms      = 2000
offset_x           = 20
offset_y           = 8

[osd.kinds]
# V4 enabledTypes = [Volume, InputVolume, Brightness, LockKey].
volume          = true
volume_output   = true
volume_input    = true
brightness      = true
wifi            = false
bluetooth      = false
power_profile   = false
caffeine        = false
nightlight      = false
dnd             = false
lock_keys       = true
keyboard_layout = false
media           = false
privacy         = false
keyboard_backlight = false

# ── Lock Screen ───────────────────────────────────────────────────────────────
# v4: 锁定屏幕开启, blur=0, tint=0, 无动画

[lockscreen]
enabled         = true
lock_before_suspend = true
blurred_desktop = false
blur_intensity  = 0.0
tint_intensity  = 0.0

# ── System Monitor ────────────────────────────────────────────────────────────

[system.monitor]
enabled             = true
cpu_poll_seconds    = 2.0
gpu_poll_seconds    = 5.0
memory_poll_seconds = 2.0
network_poll_seconds = 3.0
disk_poll_seconds   = 10.0

# V4 warning/critical thresholds (80%/90%). V4's disk-available 20%/10%
# thresholds correspond to V5's disk-used 80%/90% thresholds.
cpu_usage_activity_threshold     = 80
cpu_usage_critical_threshold      = 90
cpu_temp_activity_threshold      = 80
cpu_temp_critical_threshold       = 90
gpu_temp_activity_threshold      = 80
gpu_temp_critical_threshold       = 90
gpu_usage_activity_threshold     = 80
gpu_usage_critical_threshold      = 90
gpu_vram_activity_threshold      = 80
gpu_vram_critical_threshold       = 90
ram_pct_activity_threshold       = 80
ram_pct_critical_threshold        = 90
swap_pct_activity_threshold      = 80
swap_pct_critical_threshold       = 90
disk_used_pct_activity_threshold = 80
disk_used_pct_critical_threshold  = 90
disk_used_activity_threshold     = 80
disk_used_critical_threshold      = 90

# ── Calendar ──────────────────────────────────────────────────────────────────
# V4 日历卡片默认可用；V5 显式开启日历事件卡片。

[calendar]
enabled = true
refresh_minutes = 15

[control_center.calendar]
show_events_card = true
show_week_numbers = false

# ── Audio ─────────────────────────────────────────────────────────────────────
# v4: volumeStep=5, visualizer linear, spectrumFrameRate=60, volumeFeedback=false

[audio]
enable_overdrive = false
enable_sounds    = false
sound_volume     = 0.5

[audio.spectrum]
# V4 SpectrumService frequency window; native V5 defaults remain 20–20000 Hz.
lower_cutoff_hz = 50
upper_cutoff_hz = 12000

# ── Brightness ────────────────────────────────────────────────────────────────
# v4: intel_backlight, eDP-1, 5% step

[brightness]
enable_ddcutil     = false
# V4 brightnessctl -n enforces the hardware minimum rather than allowing 0.
minimum_brightness = 0.01

# The V4 setting still names an old intel_backlight path, but its runtime falls
# back to the only detected backlight. Declare the current device explicitly in
# V5 so eDP-1 keeps the same working brightness controls.
[brightness.monitor.eDP-1]
backend          = "backlight"
backlight_device = "nvidia_0"

# V4 SystemMonitor batteryWarningThreshold = 30
[battery]
warning_threshold = 30

# ── Night Light ───────────────────────────────────────────────────────────────
# v4: disabled

[nightlight]
enabled              = false
temperature_day      = 6500
temperature_night    = 6000

# ── Idle ──────────────────────────────────────────────────────────────────────
# v4: disabled (enabled: false)
# 保留 V4 的锁屏、息屏、挂起时间，但仍保持关闭

[idle]
behavior_order = ["lock", "screen-off", "suspend"]
pre_action_fade_seconds = 5.0

[idle.behavior.lock]
timeout = 660
action = "lock"
enabled = false

[idle.behavior.screen-off]
timeout = 600
action = "screen_off"
enabled = false

[idle.behavior.suspend]
timeout = 1800
action = "lock_and_suspend"
enabled = false

# ── Hooks ─────────────────────────────────────────────────────────────────────
# v4: disabled

[hooks]

# ── Keybinds ──────────────────────────────────────────────────────────────────

[keybinds]
validate       = ["return", "kp_enter", "space"]
cancel         = ["escape"]
left           = ["left"]
right          = ["right"]
up             = ["up"]
down           = ["down"]
tab_next       = ["tab"]
tab_previous   = ["shift+tab", "iso_left_tab"]

# ═══════════════════════════════════════════════════════════════════════════════
# BAR — 顶栏
# ═══════════════════════════════════════════════════════════════════════════════
# v4 布局还原:
#   左: 启动器 · 时钟 · Todo · 系统监控(网络) · 媒体(mini) · 波形
#   中: 间距 · showmethekey
#   右: Catwalk · 工作区 · 托盘 · 壁纸 · 录屏 · 截图 · TTS · 通知 · 音量 · 亮度 · 蓝牙 · 网络 · 电池
#
# 已补齐/替换的 V4 功能:
#   - showmethekey 文本流 → baizhu/showmethekey（V5 Luau stream）
#   - todo → baizhu/todo（V5 Luau panel/widget）
#   - catwalk → baizhu/catwalk（保留 V4 猫图与 CPU 动画）
#   - screen-recorder → 本地 V4-compatible noctalia/screen_recorder fork
#   - deskvis → V5 原生 audio_visualizer（保留位置、方向、颜色和条数）
#   - SystemMonitor 网络 → baizhu/network_monitor（RX/TX 单胶囊布局）
#   - keybind-cheatsheet → baizhu/keybind_cheatsheet（Niri 原生解析）
#   - noctalia-supergfxctl → baizhu/supergfxctl
#   - screen-toolkit → baizhu/screen_toolkit（外部工具 IPC 桥）
#   - Deep Clean / Dark Mode / GPU → baizhu/v4_extras 聚合入口
# V4 未实际放入当前布局的 kde-connect 仍不添加，避免引入无对应 UI 的空插件。

[bar]
order = ["main", "bottom"]

[bar.main]
position           = "top"
# V4 density=default resolves to a 31px bar.
thickness          = 31
background_opacity = 0.0
radius             = 12
# V4 barType=simple ignores marginHorizontal/marginVertical; the bar touches
# the screen edges and spans the full width.
margin_ends        = 0
margin_edge        = 0
concave_edge_corners = false
# V4's contentPadding=2 plus its 3px vertical bar margin places the first
# capsule 5px from the screen edge when barType=simple touches that edge.
padding            = 5
widget_spacing     = 6
scale              = 1.0
# Use one shared scale for every bar label, including native and plugin widgets.
font_scale         = 0.94
# NText.qml sets Style.fontWeightMedium = 500 for the V4 bar labels.
font_weight        = 500
# V4's simple bar had no surface shadow; capsule shadows remain widget-local.
shadow             = false
auto_hide          = false
reserve_space      = true
capsule            = true
capsule_thickness   = 0.8064516129
# BarPill/SystemMonitor use Style.radiusM=16 in the V4 widgets.
capsule_radius      = 16
capsule_padding     = 4
capsule_opacity     = 0.7
font_family        = "Noto Sans CJK HK"

# V4 MediaMini is ported as one V5 plugin widget: its spectrum is drawn behind
# the complete capsule and its progress ring surrounds the inset album artwork.
start  = ["launcher", "clock", "todo", "network-speed", "media-mini"]
center = ["spacer-center", "showmethekey"]
# V4 ends at Battery; control-center/session were not part of the saved bar.
end    = ["catwalk", "workspaces", "tray", "btn-wallpaper", "screen-recorder", "screenshot", "btn-tts", "notifications", "volume", "brightness", "bluetooth", "network", "battery"]

# Noctalia V5 的辅助底栏。外观参数逐项沿用上方 main bar，
# 覆盖所有输出并从底部边缘自动显现。
[bar.bottom]
position                 = "bottom"
enabled                  = true
thickness                = 31
background_opacity       = 0.0
radius                   = 12
margin_ends              = 0
margin_edge              = 0
concave_edge_corners     = false
padding                  = 5
widget_spacing           = 6
scale                    = 1.0
font_scale               = 0.94
font_weight              = 500
shadow                   = false
auto_hide                = true
smart_auto_hide          = false
show_on_workspace_switch = false
reserve_space            = false
layer                    = "top"
capsule                  = true
capsule_thickness        = 0.8064516129
capsule_radius           = 16
capsule_padding          = 4
capsule_opacity          = 0.7
font_family              = "Noto Sans CJK HK"

start  = ["bottom-color-picker"]
center = ["bottom-taskbar"]
end    = ["bottom-display-hub", "bottom-power"]

# ── Widget 定义 ───────────────────────────────────────────────────────────────
# 启动器按钮 (左)
[widget.launcher]
type           = "launcher"
glyph          = "apps-filled"
capsule_radius = 16 # V4 CustomButton: Style.radiusM
# V4 CustomButton colorizeSystemIcon=primary.
icon_color = "primary"

[widget.launcher.actions]
left   = "panel-toggle launcher"
right  = "settings-open-widget"
middle = "settings-open-widget"

# 时钟 (左) — v4: HH:mm ddd, MMM dd
[widget.clock]
type            = "clock"
# V4 Clock.qml uses Style.radiusL=20 and Style.marginM=9 on both sides.
capsule_radius  = 20
capsule_padding = 9
# zh_CN's C strftime %a is only “三”, while Qt's ddd used by V4 is “周三”.
format          = "{:%H:%M 周%a, %b %d}"
vertical_format = "{:%H\n%M - %d/%m}"
tooltip_format  = "{:%H:%M 周%a, %b %d}"

# V4 SystemMonitor renders RX and TX inside one widget/capsule. The local
# composite port preserves that single slot and its compact monospace labels.
[widget.network-speed]
type = "baizhu/network_monitor:bar"

# 媒体 (左) — 完整移植 V4 MediaMini：背景波形、19px 封面、封面进度环。
[widget.media-mini]
type                 = "baizhu/media_mini:bar"
audio_spectrum       = true
audio_spectrum_bands = 64
# V4's measured MediaMini capsule in the supplied comparison resolves to this
# content width after V5 host padding/font rasterization differences.
content_width         = 135

# V4 Todo、showmethekey、Catwalk、录屏插件的 V5 实例。
[widget.todo]
type = "baizhu/todo:bar"

[widget.showmethekey]
type = "baizhu/showmethekey:bar"

[widget.catwalk]
type = "baizhu/catwalk:bar"

[widget.screen-recorder]
type = "noctalia/screen_recorder:recorder"

# 居中间距 (中)
[widget.spacer-center]
type   = "spacer"
length = 80

# 工作区 (右) — V4 Workspace 的 showApplications=true 是“工作区角标 +
# 当前工作区窗口图标”的 grouped taskbar，不是 V5 的普通 workspaces pill。
# V5 原生 taskbar 的 workspace grouping 正好保留图标聚焦、关闭、右键菜单、
# 活动窗口圆点以及滚轮切换工作区等交互。
[widget.workspaces]
type                       = "taskbar"
capsule                    = false
capsule_radius             = 12
font_weight                = 700
show_all_outputs           = false
only_active_workspace      = false
group_by_workspace         = true
hide_empty_workspaces      = true
workspace_group_content    = "icons"
group_single_icon_per_app  = false
workspace_group_capsule    = true
show_workspace_label       = true
workspace_label_placement  = "corner"
minimal                    = false
focused_output_only        = false
# Keep V5's independent workspace icon scale at the saved V4 value.
icon_scale                 = 1
show_active_indicator      = true
active_indicator_color     = "primary"
active_opacity             = 1.0
inactive_opacity           = 0.8
focused_color              = "primary"
occupied_color             = "secondary"
empty_color                = "secondary"
urgent_color               = "error"

[widget.workspaces.actions]
scroll_up   = "workspace-switch prev"
scroll_down = "workspace-switch next"

# 系统托盘 (右) — v4: 启用抽屉, chevron primary
[widget.tray]
type           = "tray"
capsule_radius = 16 # V4 Tray: Style.radiusM
drawer         = true
hide_passive = false
# Limit only tray-drawer icons. This keeps the Chinese Fcitx icon within its
# tile without scaling the tray capsule, bar, or workspace application icons.
drawer_item_size = 17
icon_color = "primary"

# 壁纸随机切换 (右) — v4: 左键随机, 右键切换
[widget.btn-wallpaper]
type           = "custom_button"
glyph          = "library-photo"
tooltip        = "随机壁纸"
capsule_radius = 16 # V4 CustomButton: Style.radiusM

[widget.btn-wallpaper.actions]
left  = "wallpaper-random"
right = "panel-toggle wallpaper"

# 截图 (右) — v4: 左键区域截图, 右键全屏
[widget.screenshot]
type           = "screenshot"
glyph           = "screenshot"
secondary_click = "fullscreen"
capsule_radius  = 16 # V4 CustomButton: Style.radiusM

[widget.screenshot.actions]
left   = "screenshot-region"
middle = "settings-open-widget"

# TTS 朗读 (右) — v4: 左键 speak-clip
[widget.btn-tts]
type           = "custom_button"
glyph          = "microphone"
tooltip        = "朗读剪贴板"
capsule_radius = 16 # V4 CustomButton: Style.radiusM

[widget.btn-tts.actions]
left   = "exec speak-clip"
right  = "settings-open-widget"
middle = "settings-open-widget"

# 通知 (右) — v4: 显示未读角标
[widget.notifications]
type                 = "notifications"
hide_when_no_unread  = true
capsule_radius       = 20 # V4 NIconButton: Style.radiusL

# 音量 (右) — v4: onhover, middleClick pavucontrol
[widget.volume]
type           = "volume"
device         = "output"
show_label     = false
capsule_radius = 16 # V4 BarPillHorizontal: Style.radiusM
# V4 iconColor=none resolves to onSurface in every state; mute changes only
# the glyph, never its color.
mute_color  = "on_surface"

[widget.volume.actions]
middle      = "exec pwvucontrol || pavucontrol"
scroll_up   = "volume-up 5%"
scroll_down = "volume-down 5%"

# 亮度 (右) — v4: onhover
[widget.brightness]
type                  = "brightness"
show_label            = false
show_when_unavailable = true
capsule_radius        = 16 # V4 BarPillHorizontal: Style.radiusM

[widget.brightness.actions]
scroll_up   = "brightness-up current 5%"
scroll_down = "brightness-down current 5%"

# 蓝牙 (右) — v4: onhover
[widget.bluetooth]
type           = "bluetooth"
show_label     = false
capsule_radius = 16 # V4 BarPillHorizontal: Style.radiusM

# 网络 (右) — v4: onhover
[widget.network]
type           = "network"
show_label     = false
capsule_radius = 16 # V4 BarPillHorizontal: Style.radiusM

# 电池 (右) — v4: icon-always, showPowerProfiles
[widget.battery]
type           = "battery"
display_mode   = "glyph"
capsule_radius = 20 # V4 Battery capsule: Style.radiusL
# V4 displayMode=icon-always shows both the power glyph and percentage.
show_label       = true
label_content    = "percent"
hide_when_full   = false
hide_when_plugged = false

# 控制中心 (右)
[widget.control-center]
type  = "control-center"
glyph = "noctalia"

# 会话/电源 (右)
[widget.session]
type = "session"

# ── Bottom bar widgets ────────────────────────────────────────────────────────
[widget.bottom-color-picker]
type = "baizhu/bottom_bar:color-picker"

[widget.bottom-taskbar]
type                      = "taskbar"
color                     = "primary"
# Native taskbar titles use the 13px caption baseline while main-bar labels use
# the 14px body baseline. 14/13 makes the effective rendered text size equal.
font_scale                = 1.0769230769
group_by_workspace        = false
show_window_title         = true
window_title_max_width    = 170
taskbar_max_width         = 1200
item_spacing              = 6
only_active_workspace     = false
show_all_outputs          = false
focused_output_only       = false
icon_scale                = 1.0
show_active_indicator     = true
active_indicator_color    = "primary"
active_opacity            = 1.0
inactive_opacity          = 1.0
focused_color             = "primary"
occupied_color            = "primary"
empty_color               = "on_surface_variant"
urgent_color              = "error"

[widget.bottom-power]
type = "baizhu/bottom_bar:power"

[widget.bottom-display-hub]
type = "baizhu/bottom_bar:display-hub"

# ═══════════════════════════════════════════════════════════════════════════════
# CONTROL CENTER — 控制中心
# ═══════════════════════════════════════════════════════════════════════════════
# V4 还原: 网络、蓝牙、壁纸、Deep Clean、电源配置、保持唤醒、
# 暗色模式、SuperGFX。V5 的设置界面只允许交互添加 6 项，但运行时
# grid 支持 8 项，因此声明式配置保留 V4 的完整 4×2 顺序。

[control_center]
sidebar = "compact"

[[control_center.shortcuts]]
type = "network"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "wallpaper"

[[control_center.shortcuts]]
type = "baizhu/v4_extras:deep-clean"

[[control_center.shortcuts]]
type = "power_profile"

[[control_center.shortcuts]]
type = "caffeine"

[[control_center.shortcuts]]
type = "baizhu/v4_extras:dark-mode"

[[control_center.shortcuts]]
type = "baizhu/supergfxctl:shortcut"

# ── Session Panel ─────────────────────────────────────────────────────────────
# v4: lock/suspend/hibernate/reboot/shutdown/rebootToUefi, grid 风格

[shell.session]
grid = true
grid_columns = 3
show_shortcuts = true

[[shell.session.actions]]
action = "lock"
shortcut = "1"
countdown_seconds = 10

[[shell.session.actions]]
action = "suspend"
shortcut = "2"
countdown_seconds = 10

[[shell.session.actions]]
action = "command"
label = "Hibernate"
glyph = "moon"
command = "systemctl hibernate"
shortcut = "3"
countdown_seconds = 10

[[shell.session.actions]]
action = "reboot"
shortcut = "4"
countdown_seconds = 10

[[shell.session.actions]]
action = "shutdown"
variant = "destructive"
shortcut = "5"
countdown_seconds = 10

[[shell.session.actions]]
action = "command"
label = "UEFI"
glyph = "device-floppy"
command = "systemctl reboot --firmware-setup"
shortcut = "6"
countdown_seconds = 10

# ── Dock ──────────────────────────────────────────────────────────────────────
# v4: disabled

[dock]
enabled = false

# ── Desktop Widgets ───────────────────────────────────────────────────────────
# V4 DeskVis 的 eDP-1 实例：120x810 的竖向频谱，位于内屏右侧。
# V5 audio_visualizer 使用 810x120 后旋转 -90°，中心坐标换算自 V4 的 x/y。
# V4 的 eDP-1/eDP-2 是同一块内屏在不同启动中的连接器名；V5 通过
# make+model 稳定硬件键合并为一个实例，不再依赖连接器编号。

[desktop_widgets]
enabled = true
schema_version = 2
widget_order = ["deskvis-edp-1"]

[desktop_widgets.grid]
visible = false
cell_size = 16
major_interval = 4

[desktop_widgets.widget.deskvis-edp-1]
type        = "audio_visualizer"
# Patched V5 stable output identity: make + model, independent of eDP-1/eDP-2.
# A non-empty hardware serial is appended automatically when available.
output      = "hardware:China Star Optoelectronics Technology Co., Ltd|MNG007DA5-3"
cx          = 1362.0
cy          = 443.0
box_width   = 810.0
box_height  = 120.0
rotation    = -1.57079632679
enabled     = true

[desktop_widgets.widget.deskvis-edp-1.settings]
# V4 DeskVis renders 54 bars from a mirrored spectrum (27 unique bands on
# each side of the center). V5's mirrored mode doubles its requested bands.
visualizer_profile = "v4"
bands          = 27
mirrored       = true
reversed       = false
centered       = false
show_when_idle = false
color_1        = "primary"
color_2        = "secondary"
background     = false

# ── Backdrop ──────────────────────────────────────────────────────────────────
# niri overview 背景, 默认关闭

[backdrop]
enabled = false

# ═══════════════════════════════════════════════════════════════════════════════
# 备注: v4 → v5 变更对照
# ═══════════════════════════════════════════════════════════════════════════════
# V4 功能         → v5 实现
# ────────────────┼────────────────────────────────────────────────────────
# showmethekey    → baizhu/showmethekey:bar（runStream）
# todo 插件       → baizhu/todo:bar + :panel
# catwalk 插件    → baizhu/catwalk:bar + :panel（复用 V4 图像）
# screen-recorder → 本地 V4-compatible noctalia/screen_recorder fork
# deskvis         → 原生 audio_visualizer desktop widget
# keybind-cheatsheet → baizhu/keybind_cheatsheet:panel
# supergfxctl     → baizhu/supergfxctl:shortcut + :panel
# screen-toolkit  → baizhu/screen_toolkit:service + :panel
# Deep Clean 等   → baizhu/v4_extras 独立 shortcut + SuperGFX shortcut
# MediaMini       → baizhu/media_mini:bar（背景 wave + 封面进度环）
# system monitor   → baizhu/network_monitor:bar（rx/tx 合并为一个实例）
# wallpaper toggle → wallpaper-random + panel-toggle wallpaper
# colorScheme      → theme.mode / theme.source 体系
# kde-connect      → V4 当前布局未实际使用，保留为未迁移项
